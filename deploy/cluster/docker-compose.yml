services:
  api:
    image: ${DS_IMAGE:-dolphinscheduler-cluster:3.4.2}
    environment: &ds-env
      SERVICE: api
      DATABASE: mysql
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://${DS_DB_HOST}:${DS_DB_PORT:-3306}/${DS_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DS_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DS_DB_PASSWORD}
      REGISTRY_TYPE: jdbc
      REGISTRY_HIKARICONFIG_DRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      REGISTRY_HIKARICONFIG_JDBCURL: jdbc:mysql://${DS_DB_HOST}:${DS_DB_PORT:-3306}/${DS_DB_NAME}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      REGISTRY_HIKARICONFIG_USERNAME: ${DS_DB_USER}
      REGISTRY_HIKARICONFIG_PASSWORD: ${DS_DB_PASSWORD}
    expose:
      - "12345"
    restart: unless-stopped
    volumes:
      - ds-logs:/opt/dolphinscheduler/logs
      - ds-resources:/opt/dolphinscheduler/resource
    networks: [ds]
    deploy:
      replicas: 2

  master:
    image: ${DS_IMAGE:-dolphinscheduler-cluster:3.4.2}
    environment:
      <<: *ds-env
      SERVICE: master
    restart: unless-stopped
    volumes:
      - ds-logs:/opt/dolphinscheduler/logs
    networks: [ds]
    deploy:
      replicas: 2

  worker:
    image: ${DS_IMAGE:-dolphinscheduler-cluster:3.4.2}
    environment:
      <<: *ds-env
      SERVICE: worker
      WORKER_EXECUTION_PATH: /tmp/dolphinscheduler
    restart: unless-stopped
    volumes:
      - worker-data:/tmp/dolphinscheduler
      - ds-logs:/opt/dolphinscheduler/logs
      - ds-resources:/opt/dolphinscheduler/resource
    networks: [ds]
    deploy:
      replicas: 2

  alert:
    image: ${DS_IMAGE:-dolphinscheduler-cluster:3.4.2}
    environment:
      <<: *ds-env
      SERVICE: alert
    restart: unless-stopped
    volumes:
      - ds-logs:/opt/dolphinscheduler/logs
    networks: [ds]
    deploy:
      replicas: 1

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "${NGINX_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [ds]

volumes:
  ds-logs:
  ds-resources:
  worker-data:

networks:
  ds:
    driver: bridge
